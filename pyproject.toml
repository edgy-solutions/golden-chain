[project]
name = "golden-chain"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["rdflib", "pyshacl"]

[project.optional-dependencies]
test = ["pytest"]
# tools/column_rule.py (page-image measurement; not needed by ingest or tests).
measure = ["pypdfium2", "numpy", "pillow"]

[tool.setuptools]
packages = ["goldenchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
